<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vydané faktury – PHM Trans</title>
  <link rel="stylesheet" href="/erp.css?v=3">
</head>
<body>
  <header>
    <div>
      <p class="brand"><span>PHM</span> TRANS</p>
      <h1>Vydané faktury</h1>
    </div>
    <div class="header-actions">
      <a class="home" href="https://www.phmtrans.cz/">Rozcestník</a>
      <button type="button" id="logout">Odhlásit</button>
    </div>
  </header>
  <form id="range">
    <label>Od <input id="from" name="from" type="date" required></label>
    <label>Do <input id="to" name="to" type="date" required></label>
    <button type="submit">Zobrazit</button>
    <button type="button" data-range="year">Tento rok</button>
    <button type="button" data-range="month">Tento měsíc</button>
  </form>
  <p id="message" hidden></p>
  <section class="cards" id="cards" hidden>
    <article><span>Faktur</span><strong id="count">0</strong></article>
    <article><span>Celkem s DPH</span><strong id="total">0</strong></article>
    <article><span>Uhrazeno</span><strong id="paid">0</strong></article>
    <article><span>Zbývá</span><strong id="unpaid">0</strong></article>
    <article class="alert"><span>Po splatnosti</span><strong id="overdue">0</strong></article>
  </section>
  <section id="chart-wrap" hidden>
    <h2>Obrat po měsících</h2>
    <div id="chart"></div>
  </section>
  <section id="table-wrap" hidden>
    <h2>Doklady</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Číslo</th>
            <th>Datum</th>
            <th>Splatnost</th>
            <th>Odběratel</th>
            <th class="num">Částka</th>
            <th class="num">Uhrazeno</th>
            <th class="num">Zbývá</th>
            <th>Stav</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <script src="/erp.js?v=3"></script>
</body>
</html>
