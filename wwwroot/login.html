<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přihlášení – PHM Trans</title>
  <link rel="stylesheet" href="/erp.css?v=18">
  <style>
    .note { color: var(--text-secondary); font-size: 0.88rem; }
  </style>
</head>
<body>
  <header class="login-bar">
    <a class="brand" href="https://phmtrans.cz/"><span>PHM</span> TRANS</a>
    <div class="header-actions">
      <a class="site-back" href="https://phmtrans.cz/">Zpět na web</a>
    </div>
  </header>
  <main class="login-card">
    <h1>Přihlášení</h1>
    <p class="note">Účet intranetu. Účet Pohody se pro vstup nepoužívá.</p>
    <form id="login">
      <label>Uživatelské jméno <input id="username" name="username" autocomplete="username" required></label>
      <label>Heslo <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="message" hidden></p>
      <button type="submit">Přihlásit</button>
    </form>
  </main>
  <script>
    const form = document.querySelector("#login");
    const message = document.querySelector("#message");
    const params = new URLSearchParams(location.search);
    const requested = params.get("returnUrl") || "";
    const nextUrl = requested.startsWith("/") && !requested.startsWith("//") ? requested : "";

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.hidden = true;
      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.querySelector("#username").value,
          password: document.querySelector("#password").value
        })
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) {
        location.href = nextUrl || data.redirect || "/";
        return;
      }
      message.hidden = false;
      message.textContent = data.message || "Přihlášení se nepodařilo.";
    });
  </script>
</body>
</html>
